<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promo Eigerindo</title>
<meta name="theme-color" content="#073763">
<link rel="icon" type="image/svg+xml" href="img/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=18">
<style>
/* ---------- kartu promo ---------- */
.pcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:14px 15px;position:relative;overflow:hidden;min-height:150px}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.pcard:hover,.pcard:focus-visible{box-shadow:0 10px 26px rgba(11,27,74,.13)}
.pcard .cat{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:7px;padding:3px 8px}
.pcard b{font-size:15px;line-height:1.3;color:var(--ink)}
.pcard .meta{font-size:12.5px;color:var(--muted);line-height:1.45;display:flex;flex-direction:column;gap:2px}
.pcard .meta span{display:flex;gap:6px;align-items:flex-start}
.pcard .meta svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--brand-3)}
.tg{align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tint);color:var(--brand)}
.tg.ok{background:var(--ok-bg);color:var(--ok)}.tg.warm{background:var(--orange-tint);color:var(--orange-2)}.tg.hot{background:var(--bad-bg);color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hscroll>.pcard{flex:0 0 min(280px,84%)}
@media (min-width:960px){.hscroll>.pcard{flex:none}}

/* ---------- kalender ---------- */
table.cg{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.cg th{font-size:11.5px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cg td{vertical-align:top;height:58px;border-radius:12px;background:var(--tint);padding:5px 6px;cursor:pointer}
.cg td.off{background:transparent;cursor:default}
.cg td.we{background:#F8F2EC}
.cg td.today{outline:2.5px solid var(--orange);outline-offset:-1px}
.cg td.sel{background:var(--brand)}.cg td.sel .dn{color:#fff}
.cg .dn{font-size:12px;font-weight:700;color:var(--muted)}
.cg td.has .dn{color:var(--ink)}
.cg .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.cg .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.gantt{overflow-x:auto}
table.gt{border-collapse:separate;border-spacing:0;font-size:11px;width:100%;min-width:640px}
.gt th{font-weight:700;color:var(--muted);padding:3px 0;text-align:center;min-width:17px}
.gt th.nm,.gt td.nm{text-align:left;min-width:170px;max-width:220px;padding:5px 10px 5px 0;font-size:12.5px;font-weight:600;position:sticky;left:0;background:#fff;z-index:1}
.gt td{height:26px;padding:2px 0;border-bottom:1px solid var(--line)}
.gt td i{display:block;height:12px;background:var(--c);border-radius:3px}
.gt .we{background:#FBF7F3}.gt .td{background:var(--orange-tint)}
.gt tr{cursor:pointer}

/* ---------- kalender gaya juknis ---------- */
.panel.kal{padding:0;overflow:hidden}
.kban{background:var(--brand-2);color:#fff;padding:16px 18px;border-bottom:5px solid var(--orange);display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
.kban h2{margin:0;font-size:18px;font-weight:800;letter-spacing:.01em;line-height:1.2}
.kban span{font-size:11.5px;color:#C9D3F0;font-weight:700;letter-spacing:.05em}
.kwrap{padding:12px;display:grid;gap:14px}
.kcal{--bh:20px;min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kdn{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;font-weight:800;color:var(--brand-2);letter-spacing:.05em;padding:8px 0;background:var(--tint)}
.kdn .we{color:var(--orange-2)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:3px;min-height:58px;border-top:1px solid var(--line)}
.kd{grid-row:1/-1;border-left:1px solid var(--line);padding:4px 5px;cursor:pointer;background:#fff;min-width:0}
.kd:first-child{border-left:0}
.kd span{font-size:12px;font-weight:700;display:inline-block;min-width:20px;text-align:center}
.kd.we span{color:var(--orange-2)}
.kd.off{background:var(--bg);cursor:default}
.kd.today span{background:var(--orange);color:#fff;border-radius:999px;padding:0 6px}
.kd.sel{background:var(--tint)}
.kb{all:unset;box-sizing:border-box;cursor:pointer;z-index:1;margin:0 2px;height:var(--bh);border-radius:6px;background:var(--c);color:#fff;font-size:10.5px;font-weight:700;
  padding:0 6px;line-height:var(--bh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;box-shadow:0 1px 3px rgba(11,27,74,.18)}
.kb:hover,.kb:focus-visible{filter:brightness(1.1)}
.kside{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kside h3{margin:0 0 10px;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--brand-2)}
.kgh{background:var(--c);color:#fff;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;border-radius:9px;padding:7px 12px}
.kg ul{list-style:none;margin:6px 0 12px;padding:0 4px}
.kg li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:13px;padding:4px 0;line-height:1.35;width:100%}
.kg li button:not(.hutl)::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);flex:none;transform:translateY(-2px)}
.kg li button:hover{color:var(--brand)}
.hut{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange-2);flex:none}
.knote{font-size:12px;color:var(--orange-2);margin:4px 0 0;display:flex;gap:8px;align-items:baseline;font-weight:600}
@media (min-width:960px){
  .kwrap{grid-template-columns:minmax(0,2.1fr) minmax(250px,.9fr);padding:18px;align-items:start}
  .kcal{--bh:24px}.wk{min-height:88px}.kb{font-size:11.5px;padding:0 8px}
  .kban{padding:20px 24px}.kban h2{font-size:24px}.kban span{font-size:13px}
}
@media (max-width:420px){.kcal{--bh:18px}.kb{font-size:9.5px;padding:0 4px;margin:0 1px;border-radius:4px}.kd{padding:3px 2px}.kd span{font-size:11px}.kwrap{padding:8px}}

/* ---------- memo & list ---------- */
.memo{border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:16px;padding:14px 15px;margin-bottom:10px;background:#fff}
.memo h4{margin:0 0 6px;font-size:15px}
.memo ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6}
.memo .tab{margin-top:10px;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted);white-space:pre-wrap}
.xl{display:flex;flex-direction:column;gap:8px}
.xl a{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-decoration:none;color:var(--ink)}
.xl a:hover{border-color:var(--brand)}
.xl .x{width:38px;height:38px;flex:none;border-radius:11px;background:#E7F4EC;color:#107C41;display:grid;place-items:center}
.xl .x svg{width:20px;height:20px}
.xl b{display:block;font-size:13.5px}.xl small{display:block;color:var(--muted);font-size:12px}
.xl .go{margin-left:auto;color:var(--brand-3)}.xl .go svg{width:18px;height:18px}
.olist .r{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.olist .r:first-child{border-top:0}
.olist .av{width:34px;height:34px;border-radius:11px;background:var(--tint);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.olist .r b{display:block;font-size:13.5px}.olist .r small{color:var(--muted);font-size:12px}
.olist .t{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}

/* ---------- detail promo ---------- */
.dcat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--c);border-radius:7px;padding:3px 9px}
.drawer h2{margin:8px 0 6px;font-size:21px;font-weight:800;letter-spacing:-.015em;color:var(--brand)}
.drawer h3{margin:20px 0 8px;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--brand-2)}
.sk{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border-radius:14px;overflow:hidden}
.sk th{text-align:left;width:128px;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.sk td{padding:9px 12px;border-bottom:1px solid var(--line)}
.sk tr:last-child th,.sk tr:last-child td{border-bottom:0}
.lst{margin:0;padding:12px 14px 12px 32px;font-size:13.5px;line-height:1.6;background:#fff;border-radius:14px}
.tips{background:var(--orange-tint);border-radius:14px;padding:11px 13px;font-size:13.5px;margin-top:10px}
.ex{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.ex-h{display:flex;align-items:center;gap:8px}
.ex-h .n{width:24px;height:24px;flex:none;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.ex-h b{flex:1;color:var(--c);font-size:13.5px}
.ex p{margin:6px 0 0;font-size:13px}
.ex-r{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:10px;padding:7px 10px;margin-top:6px;font-size:13px}
.ex-r b{color:var(--ok);white-space:nowrap}.ex.no .ex-r b{color:var(--muted)}

/* ---------- login toko ---------- */
.gate input#siteIn{font-size:22px;letter-spacing:.18em;text-align:center;font-weight:800;color:var(--brand)}
@media (min-width:960px){
  .cg td{height:76px}
  .sheet .hello{margin-bottom:16px}
}
.kag{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.kag h4{margin:0 0 6px;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--brand-2)}
.kai{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-radius:10px}
.kai:hover,.kai:focus-visible{background:var(--tint)}
.kai>i{width:10px;height:34px;border-radius:4px;background:var(--c);flex:none}
.kai>span{flex:1;min-width:0}
.kai b{display:block;font-size:13.5px;line-height:1.3;color:var(--ink)}
.kai small{display:block;font-size:12px;color:var(--muted)}
.kai .tg{flex:none}

/* ---------- list artikel & cek stok ---------- */
.mcbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.mcact{display:flex;gap:6px;margin-left:auto}
.mcg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.mcg>summary::-webkit-details-marker{display:none}
.mcg>summary::before{content:"";width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
.mcg[open]>summary::before{transform:rotate(45deg)}
.mcg>summary .mn{font-weight:800;min-width:0}
.mcg>summary .ms{font-size:12px;opacity:.85;font-weight:600}
.mcg>summary .mb{margin-left:auto;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--orange-tint);color:var(--orange-2);white-space:nowrap}
.mcg>summary .mb.ok{background:var(--ok-bg);color:var(--ok)}
.mc1{border:1px solid var(--line);border-radius:16px;margin-top:10px;background:#fff;overflow:hidden}
.mc1>summary{padding:12px 14px;background:var(--brand);color:#fff;font-size:14.5px}
.mc1>summary .mb{background:#fff}
.mc1>summary .mb.ok{background:#fff;color:var(--ok)}
.mc2>summary{padding:10px 14px;background:var(--tint);color:var(--brand-2);border-top:1px solid var(--line);font-size:13.5px}
.mc3>summary{padding:9px 14px 9px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
.mc3>summary .mn{font-weight:700}
.mcrows{padding:0 12px 4px 24px;border-top:1px solid var(--line)}
.mcrows .crow:last-child{border-bottom:0}
@media (max-width:640px){.mc3>summary{padding-left:16px}.mcrows{padding:0 8px 4px 10px}.mcact{margin-left:0}}
@media (prefers-reduced-motion:reduce){.mcg>summary::before{transition:none}}

.pr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 7px;margin:5px 0 2px}
.pr .dsc{background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;align-self:center}
.pr b{font-size:15.5px;font-weight:800;color:var(--orange-2);letter-spacing:-.01em}
.pr s{font-size:12.5px;color:var(--muted)}
.pr b.nm{color:var(--ink)}
.pr small{font-size:11.5px;color:var(--muted)}

.xl .xb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;color:var(--ink)}
.xl .xb:hover,.xl .xb:focus-visible{border-color:var(--brand)}
.drop{position:relative;display:grid;place-items:center;gap:4px;border:2px dashed var(--line-2);border-radius:18px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--tint)}
.drop:hover,.drop.over{border-color:var(--orange);background:var(--orange-tint)}
.drop .di{width:52px;height:52px;border-radius:16px;background:#fff;color:var(--orange);display:grid;place-items:center;box-shadow:0 4px 12px rgba(11,27,74,.08);margin-bottom:6px}
.drop .di svg{width:26px;height:26px}
.drop b{font-size:15px;color:var(--brand)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.note{background:var(--tint);border-left:4px solid var(--brand-3);border-radius:12px;padding:10px 13px;font-size:13px;margin:12px 0}
.note.warn{background:var(--orange-tint);border-left-color:var(--orange)}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.ktiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kt{border-radius:16px;padding:12px 14px;background:var(--tint)}
.kt span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.kt b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--brand);line-height:1.15}
.kt small{font-size:12px;color:var(--muted)}
.kt.ok{background:var(--ok-bg)}.kt.ok b{color:var(--ok)}
.kt.warn{background:var(--orange-tint)}.kt.warn b{color:var(--orange-2)}
.ctbl{width:100%;border-collapse:collapse;font-size:13px}
.ctbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.ctbl td{padding:8px;border-bottom:1px solid var(--line)}
.ctbl td.r,.ctbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.ctbl tr.lk{cursor:pointer}.ctbl tr.lk:hover td{background:var(--tint)}
.cwrap{overflow-x:auto;margin:0 -4px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.crow.hasf{grid-template-columns:64px minmax(0,1fr) auto;align-items:start}
.lvt .pth{width:48px;height:48px;border-radius:9px}
.crow b{font-size:13.5px;line-height:1.3}
.crow .sub{font-size:12px;color:var(--muted)}
.crow .lc{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.crow .lc span{font-size:11px;font-weight:700;border-radius:7px;padding:2px 7px;background:var(--tint);color:var(--brand)}
.crow .bins{font-size:11.5px;color:var(--muted);margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace}
.crow .q{text-align:right;white-space:nowrap}
.crow .q div{font-size:12px;color:var(--muted)}
.crow .q div b{font-size:15px;color:var(--ink);margin-left:4px}
.crow .q .tg{margin-top:4px;display:inline-block}
.cfil{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 6px}
.cfil .inp{flex:1 1 180px;width:auto}
.lvt{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:12px;overflow:hidden}
.lvt th{text-align:left;padding:8px 10px;background:var(--tint);color:var(--brand);font-size:11.5px;position:sticky;top:0}
.lvt td{padding:7px 10px;border-top:1px solid var(--line)}
@media (min-width:960px){.ktiles{grid-template-columns:repeat(4,minmax(0,1fr))}.kt b{font-size:28px}}
</style>

<body class="locked">

<div class="gate" id="gate">
  <img class="glogo" src="img/logo-white.png" alt="Eigerindo MPI">
  <div class="gcover"><b>Petunjuk Teknis</b><span>Program Promo</span><i></i><small>Untuk seluruh toko Eigerindo</small></div>
  <form class="box" onsubmit="return false">
    <h1>Masuk toko</h1>
    <p class="lead" id="gateLead">Ketik No Site toko kamu untuk membuka promo yang berlaku.</p>
    <label for="siteIn" id="siteLbl">No Site</label>
    <input id="siteIn" class="inp" inputmode="numeric" autocomplete="username" placeholder="2278" maxlength="80">
    <div id="pwWrap" hidden style="margin-top:10px"><label for="pwIn" id="pwLbl">Password admin</label><input id="pwIn" class="inp" type="password" autocomplete="current-password"></div>
    <button class="btn primary block" id="gateGo" style="margin-top:12px">Masuk</button>
    <div class="err" id="gateErr"></div>
    <p class="small muted" id="gNote" style="margin:6px 0 0">No Site belum terdaftar? Hubungi admin area.</p>

    <p class="small gmodes" id="gBack" hidden><button type="button" class="lnk" data-mode="toko">Kembali masuk dengan No Site</button><button type="button" class="lnk" id="hoResend" hidden>Kirim ulang kode</button></p>
  </form>
</div>

<aside class="side" aria-label="Menu">
  <img class="logo" src="img/logo-white.png" alt="Eigerindo MPI">
  <nav class="snav" id="snav"></nav>
  <div class="foot" id="sfoot"></div>
</aside>

<header class="topbar">
  <img class="logo" src="img/logo-white.png" alt="Eigerindo MPI">
  <span class="ttl" id="tbTitle"></span>
  <span class="sp"></span>
  <button class="ibtn" id="tbOnline" title="Siapa online"></button>
  <button class="ibtn" id="tbOut" title="Keluar"></button>
</header>

<main class="stage"><div class="inner" id="view"><div class="loading"><span class="spin"></span>Memuat promo…</div></div></main>

<nav class="bnav" id="bnav" aria-label="Navigasi"></nav>

<script>
'use strict';
var CFG = window.PROMO_CFG || {};
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var pad = function (n) { return ('0' + n).slice(-2); };
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
var MONL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
var DOW = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

var fmtDateS = function (iso) { if (!iso) return '–'; var a = iso.split('-'); return +a[2] + ' ' + MON[+a[1] - 1]; };
var fmtMonth = function (m) { var a = String(m || '').split('-'); return MONL[+a[1] - 1] ? MONL[+a[1] - 1] + ' ' + a[0] : String(m || ''); };
var dimOf = function (m) { var a = m.split('-'); return new Date(+a[0], +a[1], 0).getDate(); };
var dowOf = function (iso) { var a = iso.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]).getDay(); };
function dayDiff(a, b) { var p = a.split('-').map(Number), q = b.split('-').map(Number); return Math.round((Date.UTC(q[0], q[1] - 1, q[2]) - Date.UTC(p[0], p[1] - 1, p[2])) / 864e5); }
function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function toast(m, ms) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, ms || 2600); }
var LS = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
           set: function (k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };

/* Google Sheets kadang mengembalikan bulan sebagai tanggal panjang; ubah ke "2026-10" */
var MEN = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };
function normMonth(v) {
  var t = String(v == null ? '' : v), m = t.match(/^(\d{4})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad(m[2]);
  m = t.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{1,2}\s+(\d{4})/);
  return m ? m[2] + '-' + pad(MEN[m[1]]) : t;
}
function normData(d) {
  if (!d) return d;
  (d.promos || []).forEach(function (p) { p.month = normMonth(p.month); p.cat = normCat(p.cat); });
  (d.memos || []).forEach(function (x) { x.month = normMonth(x.month); });
  var b = {}; Object.keys(d.bulan || {}).forEach(function (k) { b[normMonth(k)] = d.bulan[k]; }); d.bulan = b;
  var ms = {}; (d.months || []).forEach(function (k) { ms[normMonth(k)] = 1; });
  d.months = Object.keys(ms).filter(function (k) { return /^\d{4}-\d{2}$/.test(k); }).sort();
  return d;
}
/* urutan prioritas kategori: Event paling atas */
var CAT_ORDER = CFG.ORDER || ['Event', 'Reguler', 'Bazaar', 'Banking', 'EAC', 'Tambahan', 'Lainnya'];
var PPT_CAT = { Reguler: '#1E40AF', Event: '#006064', Bazaar: '#E8500A', Banking: '#1A237E', EAC: '#6A1B9A', Tambahan: '#AD1457', Lainnya: '#5A6482' };
var CAT_LABEL = { Bazaar: 'Bazaar + FS' };
function normCat(c) {
  var t = String(c || '').toLowerCase();
  if (/regul/.test(t)) return 'Reguler';
  if (/event/.test(t)) return 'Event';
  if (/bazaa?r|factory|\bfs\b/.test(t)) return 'Bazaar';
  if (/bank|kartu/.test(t)) return 'Banking';
  if (/\beac\b|adventure club/.test(t)) return 'EAC';
  if (/tambah|lain2|additional/.test(t)) return 'Tambahan';
  var s = String(c || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : 'Lainnya';
}
function catLabel(c) { return CAT_LABEL[c] || c; }
function catRank(c) { var i = CAT_ORDER.indexOf(c); return i < 0 ? CAT_ORDER.length : i; }
function byPrio(a, b) { return catRank(a.cat) - catRank(b.cat) || (a.sort || 0) - (b.sort || 0); }

var App = { token: '', site: null, data: null, online: [], month: '', cat: '', q: '', tab: 'on', day: '', today: todayISO(), view: 'home' };

/* ------------------------------------------------------------ API --- */
function fetchT(url, init, ms) {
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, tm = ctl ? setTimeout(function () { ctl.abort(); }, ms) : 0;
  return fetch(url, Object.assign({}, init, ctl ? { signal: ctl.signal } : {})).then(function (r) { if (tm) clearTimeout(tm); return r; }, function (e) {
    if (tm) clearTimeout(tm);
    if (e && e.name === 'AbortError') throw Object.assign(new Error('Server tidak menjawab. Coba lagi beberapa saat.'), { code: 'timeout' });
    throw Object.assign(new Error('Tidak bisa terhubung. Cek koneksi internet.'), { code: 'network' });
  });
}
function readJson(r) { return r.text().then(function (t) { try { return JSON.parse(t); } catch (e) { throw Object.assign(new Error('Jawaban server tidak valid.'), { code: 'server' }); } }); }
function chk(j) { if (j && j.error) throw Object.assign(new Error(j.message || j.error), { code: j.error }); return j; }
function api(a, extra) {
  var u = new URL(CFG.API); u.searchParams.set('a', a); if (App.token) u.searchParams.set('t', App.token);
  Object.keys(extra || {}).forEach(function (k) { u.searchParams.set(k, extra[k]); });
  return fetchT(u.toString(), { redirect: 'follow' }, 45000).then(readJson).then(chk);
}
function post(body) {
  return fetchT(CFG.API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ t: App.token }, body)) }, 60000).then(readJson).then(chk);
}

/* ---------------------------------------------------------- login --- */
/* mode gerbang: toko (No Site) · admin (ID + password) · ho (email kantor + kode dari email) */
function setMode(m) {

  var T = { toko: ['No Site', '2278', 'numeric', 'Ketik No Site toko kamu untuk membuka promo yang berlaku.', 'Masuk'],
            admin: ['ID admin', 'ID admin, mis. 220450-Nama', 'text', 'Masuk sebagai admin promo.', 'Masuk'],
            ho: ['Email kantor', 'nama@eigerindo.co.id', 'email', 'Untuk tim HO. Kode masuk akan dikirim ke email kantor kamu.', 'Kirim kode'] }[m];
  i.classList.toggle('txt', m !== 'toko'); pw.classList.remove('otp');
  $('#siteLbl').textContent = T[0]; i.placeholder = T[1]; i.setAttribute('inputmode', T[2]); i.type = m === 'ho' ? 'email' : 'text';
  $('#gateLead').textContent = T[3]; $('#gateGo').textContent = T[4];
  $('#pwWrap').hidden = m !== 'admin'; $('#pwLbl').textContent = 'Password admin'; pw.type = 'password'; pw.removeAttribute('inputmode'); pw.removeAttribute('maxlength'); pw.value = '';
  $('#gModes').hidden = m !== 'toko'; $('#gNote').hidden = m !== 'toko'; $('#gBack').hidden = m === 'toko'; $('#hoResend').hidden = true;
  $('.gate .box h1').textContent = m === 'ho' ? 'Masuk HO' : m === 'admin' ? 'Masuk admin' : 'Masuk toko';
  $('#gateErr').textContent = ''; i.value = ''; i.focus();
}
function setAdminMode(on) { setMode(on ? 'admin' : 'toko'); }
function hoSend() {
  var email = ($('#siteIn').value || '').trim(), b = $('#gateGo');
  if (!email) { $('#gateErr').textContent = 'Isi email kantor dulu.'; return; }
  b.disabled = true; b.textContent = 'Mengirim kode…'; $('#gateErr').textContent = '';
  post({ a: 'hoCode', email: email }).then(function (r) {
    App._hoSent = r.email; b.disabled = false; b.textContent = 'Masuk';
    $('#pwWrap').hidden = false; $('#pwLbl').textContent = 'Kode 6 digit dari email';
    var pw = $('#pwIn'); pw.type = 'text'; pw.setAttribute('inputmode', 'numeric'); pw.setAttribute('maxlength', '6'); pw.setAttribute('autocomplete', 'one-time-code'); pw.classList.add('otp'); pw.value = ''; pw.focus();
    $('#hoResend').hidden = false;
    $('#gateLead').innerHTML = 'Kode dikirim ke <b>' + esc(r.email) + '</b>, berlaku ' + r.minutes + ' menit. Tidak masuk? Cek folder Spam/Junk.';
  }).catch(function (e) { b.disabled = false; b.textContent = 'Kirim kode'; $('#gateErr').textContent = e.message || 'Gagal mengirim kode.'; });
}
function hoVerify() {
  var code = ($('#pwIn').value || '').replace(/\D/g, ''), b = $('#gateGo');
  if (code.length !== 6) { $('#gateErr').textContent = 'Kode terdiri dari 6 angka.'; return; }
  b.disabled = true; b.textContent = 'Memeriksa…';
  post({ a: 'hoLogin', email: App._hoSent, code: code, ua: navigator.userAgent.slice(0, 100) }).then(function (r) {
    b.disabled = false; b.textContent = 'Masuk';
    App.token = r.token; App.site = r.site; App.admin = false; App.ho = true; LS.set('promo_tok', r.token);
    setMode('toko'); hideGate(); boot();
  }).catch(function (e) {
    b.disabled = false; b.textContent = 'Masuk'; $('#gateErr').textContent = e.message || 'Gagal masuk.';
    if (e.code === 'expired' || e.code === 'limit') { $('#pwWrap').hidden = true; App._hoSent = ''; $('#gateGo').textContent = 'Kirim kode'; }
  });
}
function showGate(msg) { document.body.classList.add('locked'); $('#gate').hidden = false; $('#gateErr').textContent = msg || ''; setTimeout(function () { $('#siteIn').focus(); }, 60); }
function hideGate() { document.body.classList.remove('locked'); $('#gate').hidden = true; }
function doLogin() {
  if (App._mode === 'ho') { if (App._hoSent && $('#siteIn').value.trim().toLowerCase() === App._hoSent) hoVerify(); else hoSend(); return; }
  var code = ($('#siteIn').value || '').trim(), b = $('#gateGo'), pw = $('#pwIn').value;
  if (!code) { $('#gateErr').textContent = App._admMode ? 'Isi ID admin dulu.' : 'Isi No Site toko dulu.'; return; }
  if (/@/.test(code) && App._mode !== 'ho') { setMode('ho'); $('#siteIn').value = code; hoSend(); return; }
  if (/[A-Za-z]/.test(code) && !App._admMode) { setAdminMode(true); $('#siteIn').value = code; $('#pwIn').focus(); return; }
  b.disabled = true; b.textContent = 'Memeriksa…';
  post({ a: 'login', site: code, pw: pw, ua: navigator.userAgent.slice(0, 100) }).then(function (r) {
    b.disabled = false; b.textContent = 'Masuk';
    App.token = r.token; App.site = r.site; App.admin = !!r.admin; LS.set('promo_tok', r.token); $('#pwIn').value = '';
    if (r.admin) { LS.set('promo_admin', r.token); LS.set('promo_adminName', r.site.id || r.site.name); }
    hideGate(); boot();
  }).catch(function (e) {
    b.disabled = false; b.textContent = 'Masuk';
    if (e.code === 'needpw') { if (!App._admMode) { setAdminMode(true); $('#siteIn').value = code; } $('#pwIn').focus(); }

function doLogout() {
  if (!confirm('Keluar dari halaman promo?')) return;

  if (App.admin) LS.set('promo_admin', '');

/* ----------------------------------------------------------- boot --- */
function boot() {
  $('#view').innerHTML = '<div class="loading"><span class="spin"></span>Memuat promo…</div>';
  api('boot').then(function (r) {
    App.site = r.site; App.admin = !!r.admin; App.ho = !!r.ho; App.data = normData(r.data); App.online = r.online || []; App.today = r.serverDate || todayISO();
    if (!App.month || r.data.months.indexOf(App.month) < 0) App.month = pickMonth(r.data.months);
    readHash(); render(); startPing();
  }).catch(function (e) {
    if (e.code === 'auth') { App.token = ''; LS.set('promo_tok', ''); showGate('Sesi berakhir, masukkan No Site lagi.'); return; }
    $('#view').innerHTML = '<div class="sheet"><div class="empty">Data belum bisa dimuat.<br><b>' + esc(e.message) + '</b><br><button class="btn" style="margin-top:12px" onclick="boot()">Coba lagi</button></div></div>';
  });
}
function pickMonth(ms) {
  if (!ms.length) return '';
  var live = null;
  (App.data.promos || []).forEach(function (p) { if (!live && state(p).on) live = p.month; });
  return live || (ms.indexOf(App.today.slice(0, 7)) >= 0 ? App.today.slice(0, 7) : ms[ms.length - 1]);
}

/* --------------------------------------------------- status promo --- */
function state(p) {
  var D = App.today, rs = p.ranges || [], on = false, end = null, next = null, lastEnd = '';
  rs.forEach(function (r) {
    if (D >= r[0] && D <= r[1]) { on = true; if (!end || r[1] > end) end = r[1]; }
    if (r[0] > D && (!next || r[0] < next)) next = r[0];
    if (r[1] > lastEnd) lastEnd = r[1];
  });
  if (isHeld(p)) return { hold: true, on: false, next: null, past: false, end: null, left: null, to: null };
  return { on: on, end: end, next: next, past: !on && !next, left: end ? dayDiff(D, end) : null, to: next ? dayDiff(D, next) : null };
}
function isHeld(p) { return !!(p && p.hold && p.hold.on); }
function rangeTxt(rs) {
  return (rs || []).map(function (r) {
    if (r[0] === r[1]) return fmtDateS(r[0]);
    if (r[0].slice(0, 7) === r[1].slice(0, 7)) return (+r[0].slice(8)) + '–' + fmtDateS(r[1]);
    return fmtDateS(r[0]) + ' – ' + fmtDateS(r[1]);
  }).join(', ');
}
function colorOf(cat) { return PPT_CAT[cat] || (CFG.CATS || {})[cat] || PPT_CAT.Lainnya; }
function badgeOf(S) {
  if (S.hold) return '<span class="tg held">⛔ DITAHAN, jangan dijalankan</span>';
  if (S.on) {
    if (S.left === 0) return '<span class="tg hot">Hari terakhir</span>';
    if (S.left <= 3) return '<span class="tg hot">Berakhir ' + S.left + ' hari lagi</span>';
    return '<span class="tg ok">Berjalan s/d ' + fmtDateS(S.end) + '</span>';
  }
  if (S.next) return S.to === 1 ? '<span class="tg warm">Mulai besok</span>' : '<span class="tg warm">Mulai ' + fmtDateS(S.next) + ' · ' + S.to + ' hari lagi</span>';
  return '<span class="tg">Sudah berakhir</span>';
}
function promoCard(p) {

    + (p.minTrx && !/tidak ada/i.test(p.minTrx) ? '<span>' + svg('tag') + 'Min. ' + esc(String(p.minTrx).replace(/^\s*min(imal|\.)?\s*/i, '')) + '</span>' : '')
    + (p.excel && p.excel.length ? '<span>' + svg('sheet') + p.excel.length + ' file list artikel</span>' : '')
    + (p.extra || []).map(function (e) { return '<span class="xtra">' + svg(e.type === 'tier' ? 'list' : e.type === 'eksekusi' ? 'clock' : 'file') + (({ tier: 'Ada detail tiering', eksekusi: 'Ada teknis eksekusi', steps: 'Ada alur langkah' })[e.type] || 'Ada info tambahan') + '</span>'; }).join('') + '</span></button>';
}
function monthPromos() { return (App.data.promos || []).filter(function (p) { return p.month === App.month; }).sort(byPrio); }
function monthMemos() { return (App.data.memos || []).filter(function (m) { return m.month === App.month; }); }
function split(list) {
  var on = [], soon = [], past = [], hold = [];
  list.forEach(function (p) { var S = state(p); (S.hold ? hold : S.on ? on : S.next ? soon : past).push(p); });
  on.sort(function (a, b) { return catRank(a.cat) - catRank(b.cat) || (state(a).left || 99) - (state(b).left || 99) || byPrio(a, b); });
  soon.sort(function (a, b) { return catRank(a.cat) - catRank(b.cat) || (state(a).to || 99) - (state(b).to || 99) || byPrio(a, b); });
  return { on: on, soon: soon, past: past, hold: hold };
}

function vHome() {

function timeline(list) {

var BAR_PAL = ['#0B84D8', '#E8500A', '#6A1B9A', '#2E6B4F', '#00796B', '#AD1457', '#1E40AF', '#B7791F', '#1A237E', '#455A64'];
/* promo yang berlaku sebulan penuh (atau tanggalnya mengikuti ketentuan khusus) masuk panel samping */
function isWhole(p, m) {
  if (!p.exact) return true;
  var a = m + '-01', z = m + '-' + pad(dimOf(m));
  return (p.ranges || []).some(function (r) { return r[0] <= a && r[1] >= z; });
}
function shortT(t) { return String(t || '').replace(/^promo\s+/i, ''); }
/* daftar jadwal di bawah kalender: nama lengkap promo bertanggal, urut tanggal mulai */
function agenda(bars, col) {
  var L = bars.slice().sort(function (a, b) { var x = (a.ranges[0] || [''])[0], y = (b.ranges[0] || [''])[0]; return x < y ? -1 : x > y ? 1 : catRank(a.cat) - catRank(b.cat); });
  return '<div class="kag"><h4>Jadwal promo bertanggal</h4>' + L.map(function (p) {
    var S = state(p), tag = S.hold ? '<span class="tg held">ditahan</span>' : S.on ? '<span class="tg ok">berjalan</span>' : S.next ? '<span class="tg warm">' + (S.to === 1 ? 'besok' : S.to + ' hari lagi') + '</span>' : '<span class="tg">selesai</span>';
    return '<button class="kai" data-p="' + esc(p.id) + '"><i style="--c:' + col[p.id] + '"></i><span><b>' + esc(p.title) + '</b><small>' + esc(rangeTxt(p.ranges)) + ' · ' + esc(p.cat) + '</small></span>' + tag + '</button>';
  }).join('') + '</div>';
}
function kalender(list, sel) {
  var m = App.month, n = dimOf(m), a = m + '-01', yr = m.slice(0, 4), mi = +m.slice(5) - 1;
  var whole = list.filter(function (p) { return isWhole(p, m); }), bars = list.filter(function (p) { return !isWhole(p, m); });
  var col = {}; bars.forEach(function (p, i) { col[p.id] = isHeld(p) ? '#9AA3AF' : BAR_PAL[i % BAR_PAL.length]; });
  var off = (dowOf(a) + 6) % 7, weeks = [], d = 1 - off, k;
  while (d <= n) { var w0 = []; for (k = 0; k < 7; k++) w0.push(d++); weeks.push(w0); }
  var body = weeks.map(function (w) {
    var valid = w.filter(function (x) { return x >= 1 && x <= n; });
    var ws = m + '-' + pad(valid[0]), we = m + '-' + pad(valid[valid.length - 1]), segs = [], lanes = [];
    bars.forEach(function (p) {
      (p.ranges || []).forEach(function (r) {
        var s0 = r[0] > ws ? r[0] : ws, e0 = r[1] < we ? r[1] : we;
        if (s0 <= e0) segs.push({ p: p, c1: w.indexOf(+s0.slice(8)), c2: w.indexOf(+e0.slice(8)) });
      });
    });
    segs.sort(function (x, y) { return x.c1 - y.c1 || (y.c2 - y.c1) - (x.c2 - x.c1); });
    segs.forEach(function (sg) { var L = 0; while (lanes[L] != null && lanes[L] >= sg.c1) L++; lanes[L] = sg.c2; sg.lane = L; });
    var cells = w.map(function (x, i) {
      if (x < 1 || x > n) return '<div class="kd off" style="grid-column:' + (i + 1) + '"></div>';
      var iso = m + '-' + pad(x);
      return '<div class="kd' + (i >= 5 ? ' we' : '') + (iso === App.today ? ' today' : '') + (iso === sel ? ' sel' : '') + '" data-day="' + iso + '" style="grid-column:' + (i + 1) + '"><span>' + x + '</span></div>';
    }).join('');
    var bs = segs.map(function (sg) {
      return '<button class="kb" data-p="' + esc(sg.p.id) + '" title="' + esc(sg.p.title + ' · ' + rangeTxt(sg.p.ranges)) + '" style="grid-column:' + (sg.c1 + 1) + ' / ' + (sg.c2 + 2)
        + ';grid-row:' + (sg.lane + 2) + ';--c:' + col[sg.p.id] + '">' + esc(shortT(sg.p.title)) + '</button>';
    }).join('');
    return '<div class="wk" style="grid-template-rows:26px repeat(' + lanes.length + ',var(--bh)) minmax(6px,1fr)">' + cells + bs + '</div>';
  }).join('');

  var cats = []; whole.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
  cats.sort(function (x, y) { return catRank(x) - catRank(y); });
  var hasHut = whole.some(function (p) { return !p.exact; });
  var side = '<aside class="kside"><h3>Berlaku sepanjang ' + MONL[mi] + '</h3>'
    + (cats.length ? cats.map(function (c) {
        return '<div class="kg"><div class="kgh" style="--c:' + colorOf(c) + '">' + esc(catLabel(c)) + '</div><ul>' + whole.filter(function (p) { return p.cat === c; }).map(function (p) {
          return '<li><button data-p="' + esc(p.id) + '"' + (p.exact ? '' : ' class="hutl"') + '>' + (p.exact ? '' : '<i class="hut"></i>') + esc(shortT(p.title)) + '</button></li>';
        }).join('') + '</ul></div>';
      }).join('') : '<p class="small muted" style="margin:0">Tidak ada promo yang berlaku sebulan penuh.</p>')
    + (hasHut ? '<p class="knote"><i class="hut"></i><span>Tanggal mengikuti ketentuan khusus, misalnya HUT kota per toko. Buka promonya untuk detail.</span></p>' : '')
    + '</aside>';

  return '<div class="kban"><h2>Kalender Promo ' + MONL[mi].toUpperCase() + ' ' + yr + '</h2><span>' + list.length + ' PROGRAM | 1–' + n + ' ' + MON[mi].toUpperCase() + ' ' + yr + '</span></div>'
    + '<div class="kwrap"><div class="kcal"><div class="kdn">' + ['SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB', 'MIN'].map(function (x, i) { return '<span' + (i >= 5 ? ' class="we"' : '') + '>' + x + '</span>'; }).join('') + '</div>'
    + body + (bars.length ? agenda(bars, col) : '<p class="small muted" style="margin:10px 0 0">Bulan ini tidak ada promo dengan tanggal tertentu. Semua promo berlaku sebulan penuh.</p>') + '</div>' + side + '</div>';
}

var pingT = null;

/* ---------------------------------------------------------- event --- */
document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.closest('#gateGo')) { doLogin(); return; }
  if (t.closest('#tbOut') || t.closest('#sOut') || t.closest('#aOut')) { doLogout(); return; }

    var T = App._tiles[+tile.dataset.tile], B = App.data.bulan[App.month] || {};

/* isi slide "info tambahan": tabel, kartu per kolom, atau daftar */
function infoBody(e) {
  var h = '';
  if (e.table && e.table.length) {
    var head = e.table.length > 1 ? e.table[0] : null, rows = head ? e.table.slice(1) : e.table;
    h += '<div class="xtw"><table class="xt">' + (head ? '<thead><tr>' + head.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead>' : '')
      + '<tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c, k) { return '<td' + (head ? ' data-h="' + esc(head[k] || '') + '"' : '') + '>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  var cols = (e.cols || []).filter(function (c) { return c.length; });
  if (cols.length) {
    /* baris yang menyambung (diawali huruf kecil) digabung jadi satu paragraf */
    var para = function (c) { var out = []; c.forEach(function (l) { var p = out[out.length - 1]; if (p && !l.big && !p.big && /^[a-z(]/.test(l.t) && !/[.:!?]$/.test(p.t)) p.t += ' ' + l.t; else out.push({ t: l.t, big: l.big }); }); return out; };
    var head1 = function (c) { return c.length > 1 && (c[0].big || (c[0].t.length <= 40 && /^[^a-z]*$/.test(c[0].t))); };
    h += '<div class="xcols" style="--n:' + Math.min(cols.length, 4) + '">' + cols.map(function (c, k) {
      var P = para(c), hd = head1(P) ? P.shift() : null;
      return '<div class="xcol">' + (cols.length > 1 ? '<span class="n">' + (k + 1) + '</span>' : '') + (hd ? '<b class="xch">' + esc(hd.t) + '</b>' : '')
        + P.map(function (l) { return l.big ? '<b class="xbig">' + esc(l.t) + '</b>' : '<p>' + esc(l.t) + '</p>'; }).join('') + '</div>';
    }).join('') + '</div>';
  }
  return h;
}
function openInfo(k) {
  var B = App.data.bulan[App.month] || {}, e = (B.info || [])[k]; if (!e) return;
  closeDrawer();
  var html = '<div class="ov" id="ov"><div class="drawer sld" role="dialog" aria-modal="true" style="--c:#E8500A">'
    + '<div class="sld-top"><div class="sld-hd"><h2>' + esc(e.title || 'Info tambahan') + '</h2><span class="cap">' + esc(e.sub || 'INFO TAMBAHAN') + '</span><button class="x" data-close aria-label="Tutup">' + svg('x') + '</button></div><div class="sld-acc"></div></div>'
    + '<div style="height:14px"></div>' + extrasHtml({ extra: [Object.assign({}, e, { title: '', sub: '' })] }).replace('<div class="xh"><h3>Info tambahan</h3></div>', '')
    + '<footer class="pfoot"><span>EIGER ADVENTURE &nbsp;|&nbsp; JUKNIS PROMO ' + esc(fmtMonth(App.month).toUpperCase()) + ' &nbsp;|&nbsp; INFO TAMBAHAN</span><img src="img/logo-white.png" alt="Eigerindo MPI"></footer></div></div>';
  var d = document.createElement('div'); d.innerHTML = html; document.body.appendChild(d.firstChild); document.body.style.overflow = 'hidden';
}
document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-info]'); if (b) { e.stopPropagation(); openInfo(+b.dataset.info); } }, true);

/* ===================================================== admin terlihat oleh pengunjung */
function adminOnlineTxt() {
  var a = (App.online || []).filter(function (o) { return o.kind === 'admin' && o.ago < 180; });
  if (!a.length || App.admin) return '';
  return '<span class="chip" style="background:rgba(232,80,10,.9);color:#fff">Admin online: ' + a.map(function (o) { return esc(o.name); }).join(', ') + '</span>';
}
document.addEventListener('click', function (e) {
  var m = e.target.closest && e.target.closest('[data-mode]'); if (m) { e.preventDefault(); setMode(m.dataset.mode); return; }
  if (e.target.closest && e.target.closest('#hoResend')) { e.preventDefault(); App._hoSent = ''; hoSend(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'pwIn') { e.preventDefault(); doLogin(); } });

(function init() {
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(CFG.API || '') || /GANTI_DENGAN/.test(CFG.API)) {
    hideGate(); $('#view').innerHTML = '<div class="sheet"><div class="empty">Belum tersambung ke database.<br>Isi <b>API</b> di <code>config.js</code> dengan URL Web App Apps Script.</div></div>';
    return;
  }
  App.token = LS.get('promo_tok');
  if (!App.token) { showGate(''); return; }
  hideGate(); boot();
})();
</script>
