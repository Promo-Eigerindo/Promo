<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promo Eigerindo</title>
<meta name="theme-color" content="#0F3192">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%230F3192%22/><text x=%2232%22 y=%2245%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2238%22 fill=%22white%22 text-anchor=%22middle%22>E</text><circle cx=%2250%22 cy=%2214%22 r=%226%22 fill=%22%23E46F3F%22/></svg>">
<link rel="apple-touch-icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* ---------- kartu promo ---------- */
.pcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:14px 15px;position:relative;overflow:hidden;min-height:150px}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.pcard:hover,.pcard:focus-visible{box-shadow:0 10px 26px rgba(11,27,74,.13)}
.pcard .cat{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:7px;padding:3px 8px}
.pcard b{font-size:15px;line-height:1.3;color:var(--ink)}
.pcard .meta{font-size:12.5px;color:var(--muted);line-height:1.45;display:flex;flex-direction:column;gap:2px}
.pcard .meta span{display:flex;gap:6px;align-items:flex-start}
.pcard .meta svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--brand-3)}
.tg{align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tint);color:var(--brand)}
.tg.ok{background:var(--ok-bg);color:var(--ok)}.tg.warm{background:var(--orange-tint);color:var(--orange-2)}.tg.hot{background:var(--bad-bg);color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hscroll>.pcard{flex:0 0 min(280px,84%)}
@media (min-width:960px){.hscroll>.pcard{flex:none}}

/* ---------- kalender ---------- */
table.cg{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.cg th{font-size:11.5px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cg td{vertical-align:top;height:58px;border-radius:12px;background:var(--tint);padding:5px 6px;cursor:pointer}
.cg td.off{background:transparent;cursor:default}
.cg td.we{background:#F8F2EC}
.cg td.today{outline:2.5px solid var(--orange);outline-offset:-1px}
.cg td.sel{background:var(--brand)}.cg td.sel .dn{color:#fff}
.cg .dn{font-size:12px;font-weight:700;color:var(--muted)}
.cg td.has .dn{color:var(--ink)}
.cg .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.cg .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.gantt{overflow-x:auto}
table.gt{border-collapse:separate;border-spacing:0;font-size:11px;width:100%;min-width:640px}
.gt th{font-weight:700;color:var(--muted);padding:3px 0;text-align:center;min-width:17px}
.gt th.nm,.gt td.nm{text-align:left;min-width:170px;max-width:220px;padding:5px 10px 5px 0;font-size:12.5px;font-weight:600;position:sticky;left:0;background:#fff;z-index:1}
.gt td{height:26px;padding:2px 0;border-bottom:1px solid var(--line)}
.gt td i{display:block;height:12px;background:var(--c);border-radius:3px}
.gt .we{background:#FBF7F3}.gt .td{background:var(--orange-tint)}
.gt tr{cursor:pointer}

/* ---------- memo & list ---------- */
.memo{border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:16px;padding:14px 15px;margin-bottom:10px;background:#fff}
.memo h4{margin:0 0 6px;font-size:15px}
.memo ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6}
.memo .tab{margin-top:10px;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted);white-space:pre-wrap}
.xl{display:flex;flex-direction:column;gap:8px}
.xl a{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-decoration:none;color:var(--ink)}
.xl a:hover{border-color:var(--brand)}
.xl .x{width:38px;height:38px;flex:none;border-radius:11px;background:#E7F4EC;color:#107C41;display:grid;place-items:center}
.xl .x svg{width:20px;height:20px}
.xl b{display:block;font-size:13.5px}.xl small{display:block;color:var(--muted);font-size:12px}
.xl .go{margin-left:auto;color:var(--brand-3)}.xl .go svg{width:18px;height:18px}
.olist .r{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.olist .r:first-child{border-top:0}
.olist .av{width:34px;height:34px;border-radius:11px;background:var(--tint);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.olist .r b{display:block;font-size:13.5px}.olist .r small{color:var(--muted);font-size:12px}
.olist .t{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}

/* ---------- detail promo ---------- */
.dcat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--c);border-radius:7px;padding:3px 9px}
.drawer h2{margin:8px 0 6px;font-size:21px;font-weight:800;letter-spacing:-.015em;color:var(--brand)}
.drawer h3{margin:20px 0 8px;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--brand-2)}
.sk{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border-radius:14px;overflow:hidden}
.sk th{text-align:left;width:128px;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.sk td{padding:9px 12px;border-bottom:1px solid var(--line)}
.sk tr:last-child th,.sk tr:last-child td{border-bottom:0}
.lst{margin:0;padding:12px 14px 12px 32px;font-size:13.5px;line-height:1.6;background:#fff;border-radius:14px}
.tips{background:var(--orange-tint);border-radius:14px;padding:11px 13px;font-size:13.5px;margin-top:10px}
.ex{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.ex-h{display:flex;align-items:center;gap:8px}
.ex-h .n{width:24px;height:24px;flex:none;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.ex-h b{flex:1;color:var(--c);font-size:13.5px}
.ex p{margin:6px 0 0;font-size:13px}
.ex-r{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:10px;padding:7px 10px;margin-top:6px;font-size:13px}
.ex-r b{color:var(--ok);white-space:nowrap}.ex.no .ex-r b{color:var(--muted)}

/* ---------- login toko ---------- */
.gate input#siteIn{font-size:22px;letter-spacing:.18em;text-align:center;font-weight:800;color:var(--brand)}
@media (min-width:960px){
  .cg td{height:76px}
  .sheet .hello{margin-bottom:16px}
}
</style>
</head>
<body class="locked">

<div class="gate" id="gate">
  <img class="glogo" src="img/logo-white.png" alt="Eigerindo MPI">
  <p class="gsub">Informasi promo untuk seluruh toko</p>
  <form class="box" onsubmit="return false">
    <h1>Masuk toko</h1>
    <p class="lead">Ketik No Site toko kamu untuk membuka promo yang berlaku.</p>
    <label for="siteIn">No Site</label>
    <input id="siteIn" class="inp" inputmode="numeric" autocomplete="off" placeholder="2278" maxlength="8">
    <button class="btn primary block" id="gateGo" style="margin-top:12px">Masuk</button>
    <div class="err" id="gateErr"></div>
    <p class="small muted" style="margin:6px 0 0">No Site belum terdaftar? Hubungi admin area.</p>
  </form>
</div>

<aside class="side" aria-label="Menu">
  <img class="logo" src="img/logo-white.png" alt="Eigerindo MPI">
  <nav class="snav" id="snav"></nav>
  <div class="foot" id="sfoot"></div>
</aside>

<header class="topbar">
  <img class="logo" src="img/logo-white.png" alt="Eigerindo MPI">
  <span class="sp"></span>
  <button class="ibtn" id="tbOnline" title="Toko online"></button>
  <button class="ibtn" id="tbOut" title="Keluar"></button>
</header>

<main class="stage"><div class="inner" id="view"><div class="loading"><span class="spin"></span>Memuat promo…</div></div></main>

<nav class="bnav" id="bnav" aria-label="Navigasi"></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="icons.js"></script>
<script>
'use strict';
var CFG = window.PROMO_CFG || {};
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var pad = function (n) { return ('0' + n).slice(-2); };
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
var MONL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
var DOW = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
var fmtDate = function (iso) { if (!iso) return '–'; var a = iso.split('-'); return +a[2] + ' ' + MON[+a[1] - 1] + ' ' + a[0]; };
var fmtDateS = function (iso) { if (!iso) return '–'; var a = iso.split('-'); return +a[2] + ' ' + MON[+a[1] - 1]; };
var fmtMonth = function (m) { var a = m.split('-'); return MONL[+a[1] - 1] + ' ' + a[0]; };
var dimOf = function (m) { var a = m.split('-'); return new Date(+a[0], +a[1], 0).getDate(); };
var dowOf = function (iso) { var a = iso.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]).getDay(); };
function dayDiff(a, b) { var p = a.split('-').map(Number), q = b.split('-').map(Number); return Math.round((Date.UTC(q[0], q[1] - 1, q[2]) - Date.UTC(p[0], p[1] - 1, p[2])) / 864e5); }
function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function toast(m, ms) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, ms || 2600); }
var LS = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
           set: function (k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };

var App = { token: '', site: null, data: null, online: [], month: '', cat: '', q: '', tab: 'on', day: '', today: todayISO(), view: 'home' };

/* ------------------------------------------------------------ API --- */
function fetchT(url, init, ms) {
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, tm = ctl ? setTimeout(function () { ctl.abort(); }, ms) : 0;
  return fetch(url, Object.assign({}, init, ctl ? { signal: ctl.signal } : {})).then(function (r) { if (tm) clearTimeout(tm); return r; }, function (e) {
    if (tm) clearTimeout(tm);
    if (e && e.name === 'AbortError') throw Object.assign(new Error('Server tidak menjawab. Coba lagi beberapa saat.'), { code: 'timeout' });
    throw Object.assign(new Error('Tidak bisa terhubung. Cek koneksi internet.'), { code: 'network' });
  });
}
function readJson(r) { return r.text().then(function (t) { try { return JSON.parse(t); } catch (e) { throw Object.assign(new Error('Jawaban server tidak valid.'), { code: 'server' }); } }); }
function chk(j) { if (j && j.error) throw Object.assign(new Error(j.message || j.error), { code: j.error }); return j; }
function api(a, extra) {
  var u = new URL(CFG.API); u.searchParams.set('a', a); if (App.token) u.searchParams.set('t', App.token);
  Object.keys(extra || {}).forEach(function (k) { u.searchParams.set(k, extra[k]); });
  return fetchT(u.toString(), { redirect: 'follow' }, 45000).then(readJson).then(chk);
}
function post(body) {
  return fetchT(CFG.API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ t: App.token }, body)) }, 60000).then(readJson).then(chk);
}

/* ---------------------------------------------------------- login --- */
function showGate(msg) { document.body.classList.add('locked'); $('#gate').hidden = false; $('#gateErr').textContent = msg || ''; setTimeout(function () { $('#siteIn').focus(); }, 60); }
function hideGate() { document.body.classList.remove('locked'); $('#gate').hidden = true; }
function doLogin() {
  var code = ($('#siteIn').value || '').trim(), b = $('#gateGo');
  if (!code) { $('#gateErr').textContent = 'Isi No Site toko dulu.'; return; }
  b.disabled = true; b.textContent = 'Memeriksa…';
  post({ a: 'login', site: code, ua: navigator.userAgent.slice(0, 100) }).then(function (r) {
    b.disabled = false; b.textContent = 'Masuk';
    App.token = r.token; App.site = r.site; LS.set('promo_tok', r.token);
    hideGate(); boot();
  }).catch(function (e) { b.disabled = false; b.textContent = 'Masuk'; $('#gateErr').textContent = e.message || 'Gagal masuk.'; });
}
function doLogout() {
  if (!confirm('Keluar dari halaman promo?')) return;
  post({ a: 'logout' }).catch(function () {});
  App.token = ''; LS.set('promo_tok', ''); stopPing();
  $('#siteIn').value = ''; showGate('Kamu sudah keluar.');
}

/* ----------------------------------------------------------- boot --- */
function boot() {
  $('#view').innerHTML = '<div class="loading"><span class="spin"></span>Memuat promo…</div>';
  api('boot').then(function (r) {
    App.site = r.site; App.data = r.data; App.online = r.online || []; App.today = r.serverDate || todayISO();
    if (!App.month || r.data.months.indexOf(App.month) < 0) App.month = pickMonth(r.data.months);
    readHash(); render(); startPing();
  }).catch(function (e) {
    if (e.code === 'auth') { App.token = ''; LS.set('promo_tok', ''); showGate('Sesi berakhir, masukkan No Site lagi.'); return; }
    $('#view').innerHTML = '<div class="sheet"><div class="empty">Data belum bisa dimuat.<br><b>' + esc(e.message) + '</b><br><button class="btn" style="margin-top:12px" onclick="boot()">Coba lagi</button></div></div>';
  });
}
function pickMonth(ms) {
  if (!ms.length) return '';
  var live = null;
  (App.data.promos || []).forEach(function (p) { if (!live && state(p).on) live = p.month; });
  return live || (ms.indexOf(App.today.slice(0, 7)) >= 0 ? App.today.slice(0, 7) : ms[ms.length - 1]);
}

/* --------------------------------------------------- status promo --- */
function state(p) {
  var D = App.today, rs = p.ranges || [], on = false, end = null, next = null, lastEnd = '';
  rs.forEach(function (r) {
    if (D >= r[0] && D <= r[1]) { on = true; if (!end || r[1] > end) end = r[1]; }
    if (r[0] > D && (!next || r[0] < next)) next = r[0];
    if (r[1] > lastEnd) lastEnd = r[1];
  });
  return { on: on, end: end, next: next, past: !on && !next, left: end ? dayDiff(D, end) : null, to: next ? dayDiff(D, next) : null };
}
function rangeTxt(rs) {
  return (rs || []).map(function (r) {
    if (r[0] === r[1]) return fmtDateS(r[0]);
    if (r[0].slice(0, 7) === r[1].slice(0, 7)) return (+r[0].slice(8)) + '–' + fmtDateS(r[1]);
    return fmtDateS(r[0]) + ' – ' + fmtDateS(r[1]);
  }).join(', ');
}
function colorOf(cat) { return (CFG.CATS || {})[cat] || (CFG.CATS || {}).Lainnya || '#5A6482'; }
function badgeOf(S) {
  if (S.on) {
    if (S.left === 0) return '<span class="tg hot">Hari terakhir</span>';
    if (S.left <= 3) return '<span class="tg hot">Berakhir ' + S.left + ' hari lagi</span>';
    return '<span class="tg ok">Berjalan s/d ' + fmtDateS(S.end) + '</span>';
  }
  if (S.next) return S.to === 1 ? '<span class="tg warm">Mulai besok</span>' : '<span class="tg warm">Mulai ' + fmtDateS(S.next) + ' · ' + S.to + ' hari lagi</span>';
  return '<span class="tg">Sudah berakhir</span>';
}
function promoCard(p) {
  return '<button class="pcard" data-p="' + esc(p.id) + '" style="--c:' + colorOf(p.cat) + '">'
    + '<span class="cat">' + esc(p.cat) + '</span><b>' + esc(p.title) + '</b>' + badgeOf(state(p))
    + '<span class="meta"><span>' + svg('cal') + esc(rangeTxt(p.ranges)) + (p.exact ? '' : ' · lihat ketentuan') + '</span>'
    + (p.minTrx && !/tidak ada/i.test(p.minTrx) ? '<span>' + svg('tag') + 'Min. ' + esc(p.minTrx) + '</span>' : '')
    + (p.excel && p.excel.length ? '<span>' + svg('sheet') + p.excel.length + ' file list artikel</span>' : '') + '</span></button>';
}
function monthPromos() { return (App.data.promos || []).filter(function (p) { return p.month === App.month; }); }
function monthMemos() { return (App.data.memos || []).filter(function (m) { return m.month === App.month; }); }
function split(list) {
  var on = [], soon = [], past = [];
  list.forEach(function (p) { var S = state(p); (S.on ? on : S.next ? soon : past).push(p); });
  on.sort(function (a, b) { return (state(a).left || 99) - (state(b).left || 99); });
  soon.sort(function (a, b) { return (state(a).to || 99) - (state(b).to || 99); });
  return { on: on, soon: soon, past: past };
}
function liveSites() { return (App.online || []).filter(function (o) { return o.ago < 180 && o.kind === 'site'; }); }

/* --------------------------------------------------------- navigasi - */
var NAV = [['home', 'Beranda', 'home'], ['kalender', 'Kalender', 'cal'], ['jalan', 'Hari ini', 'zap'], ['memo', 'Memo', 'memo'], ['akun', 'Akun', 'user']];
var SNAV = [['home', 'Beranda', 'home'], ['jalan', 'Promo hari ini', 'zap'], ['kalender', 'Kalender', 'cal'], ['semua', 'Semua promo', 'list'],
            ['memo', 'Memo & update', 'memo'], ['artikel', 'List artikel', 'sheet'], ['akun', 'Toko online', 'users']];
function go(v, extra) {
  App.view = v; if (extra) Object.assign(App, extra);
  var h = '#' + v; if (location.hash !== h) history.pushState(null, '', h);
  render(); window.scrollTo(0, 0);
}
function readHash() { var v = (location.hash || '').slice(1); if (['home', 'jalan', 'kalender', 'semua', 'memo', 'artikel', 'akun'].indexOf(v) >= 0) App.view = v; }
window.addEventListener('popstate', function () { closeDrawer(); readHash(); if (App.data) render(); });

function renderChrome() {
  var memoN = monthMemos().length, live = liveSites().length;
  $('#bnav').innerHTML = NAV.map(function (n) {
    if (n[0] === 'jalan') return '<button class="fab' + (App.view === 'jalan' ? ' on' : '') + '" data-go="jalan"><span class="d">' + svg('zap') + '</span><span>' + n[1] + '</span></button>';
    return '<button data-go="' + n[0] + '" class="' + (App.view === n[0] ? 'on' : '') + '">' + svg(n[2]) + '<span>' + n[1] + '</span></button>';
  }).join('');
  $('#snav').innerHTML = SNAV.map(function (n) {
    var bd = n[0] === 'memo' && memoN ? '<span class="bd">' + memoN + '</span>' : n[0] === 'akun' && live ? '<span class="bd">' + live + '</span>' : '';
    return '<button data-go="' + n[0] + '" class="' + (App.view === n[0] ? 'on' : '') + '">' + svg(n[2]) + n[1] + bd + '</button>';
  }).join('');
  $('#sfoot').innerHTML = 'Masuk sebagai<b>' + esc(App.site.code) + (App.site.name ? ' · ' + esc(App.site.name) : '') + '</b>'
    + '<button class="btn sm block" id="sOut">Keluar</button>';
  $('#tbOnline').innerHTML = svg('users') + (live ? '<span class="bd">' + live + '</span>' : '');
  $('#tbOut').innerHTML = svg('out');
}

/* ----------------------------------------------------------- render - */
function render() {
  if (!App.data) return;
  document.title = CFG.BRAND || 'Promo Eigerindo';
  renderChrome();
  var fn = { home: vHome, jalan: vJalan, kalender: vKalender, semua: vSemua, memo: vMemo, artikel: vArtikel, akun: vAkun }[App.view] || vHome;
  $('#view').innerHTML = fn();
}
function head(title, sub) {
  return '<div class="pagehead"><button class="back" data-go="home" aria-label="Kembali">' + svg('back') + '</button><div><h1>' + esc(title) + '</h1>'
    + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div></div>';
}
function monthSelect() {
  var ms = App.data.months;
  if (!ms.length) return '<span class="lbl">Belum ada promo</span>';
  return '<label class="lbl">Periode <select id="mSel" aria-label="Pilih bulan">' + ms.slice().reverse().map(function (m) {
    return '<option value="' + m + '"' + (m === App.month ? ' selected' : '') + '>' + fmtMonth(m) + '</option>'; }).join('') + '</select></label>';
}
function countExcel(list) { var n = 0; list.forEach(function (p) { n += (p.excel || []).length; }); return n; }

function vHome() {
  var list = monthPromos(), S = split(list), memos = monthMemos(), B = App.data.bulan[App.month] || {}, live = liveSites().length;
  var tiles = [
    ['jalan', 'Berjalan', 'zap', '#13806F', '#E3F4F0', S.on.length, { tab: 'on' }],
    ['jalan', 'Akan datang', 'clock', '#C9531F', '#FDF0EA', S.soon.length, { tab: 'soon' }],
    ['kalender', 'Kalender', 'cal', '#7A4FB5', '#F1EBFA', 0],
    ['semua', 'Semua promo', 'list', '#0F3192', '#EEF2FB', 0],
    ['memo', 'Memo', 'memo', '#E46F3F', '#FDF0EA', memos.length],
    ['artikel', 'List artikel', 'sheet', '#107C41', '#E7F4EC', 0],
    [B.fileJuknis ? 'pdf' : 'nopdf', 'Juknis PDF', 'file', '#C0392B', '#FDECEB', 0],
    ['akun', 'Toko online', 'users', '#1B47C2', '#E6EDFC', live]
  ];
  var grid = '<div class="igrid">' + tiles.map(function (t, i) {
    return '<button class="ic" data-tile="' + i + '" style="--c:' + t[3] + ';--t:' + t[4] + '"><span class="i">' + svg(t[2]) + '</span><span>' + t[1] + '</span>'
      + (t[5] ? '<span class="bd">' + t[5] + '</span>' : '') + '</button>';
  }).join('') + '</div>';
  App._tiles = tiles;
  var sum = '<div class="sum">' + monthSelect()
    + '<div class="big"><b>' + S.on.length + '</b><small>promo berjalan hari ini</small></div>'
    + '<div class="small muted" style="margin-top:2px">' + esc(B.title || 'Promo ' + (App.month ? fmtMonth(App.month) : '')) + (B.period ? ' · ' + esc(B.period) : '') + '</div>'
    + '<div class="row"><span class="chip">' + list.length + ' program</span><span class="chip">' + S.soon.length + ' akan datang</span>'
    + (countExcel(list) ? '<span class="chip ok">' + countExcel(list) + ' list artikel</span>' : '') + '</div></div>';
  var h = '<section class="sheet"><p class="hello">HALO, <b>' + esc(App.site.name || 'Toko ' + App.site.code) + '</b><span class="chip live">' + live + ' toko online</span></p>'
    + '<div class="sumwrap">' + sum + grid + '</div></section>';
  if (B.catatan) h += '<section class="panel" style="border-left:5px solid var(--orange)"><div class="ph"><h2>Catatan admin</h2></div><p style="margin:0;font-size:13.5px">' + esc(B.catatan) + '</p></section>';
  h += '<section class="panel"><div class="ph"><h2>Sedang berjalan</h2><button class="more" data-go="jalan" data-tab="on">Selengkapnya</button></div>'
    + (S.on.length ? '<div class="hscroll">' + S.on.map(promoCard).join('') + '</div>' : '<div class="empty">Tidak ada promo yang berjalan hari ini.</div>') + '</section>';
  h += '<section class="panel"><div class="ph"><h2>Akan berjalan</h2><button class="more" data-go="jalan" data-tab="soon">Selengkapnya</button></div>'
    + (S.soon.length ? '<div class="hscroll">' + S.soon.map(promoCard).join('') + '</div>' : '<div class="empty">Belum ada promo berikutnya di bulan ini.</div>') + '</section>';
  if (memos.length) h += '<section class="panel"><div class="ph"><h2>Memo terbaru</h2><button class="more" data-go="memo">Selengkapnya</button></div>' + memoCard(memos[memos.length - 1]) + '</section>';
  return h;
}
function vJalan() {
  var S = split(monthPromos()), t = App.tab || 'on', L = S[t] || [];
  return '<section class="sheet">' + head('Promo hari ini', fmtDate(App.today) + ' · ' + fmtMonth(App.month))
    + '<div class="seg" style="margin-bottom:14px"><button data-tab="on" class="' + (t === 'on' ? 'on' : '') + '">Berjalan (' + S.on.length + ')</button>'
    + '<button data-tab="soon" class="' + (t === 'soon' ? 'on' : '') + '">Akan datang (' + S.soon.length + ')</button>'
    + '<button data-tab="past" class="' + (t === 'past' ? 'on' : '') + '">Selesai (' + S.past.length + ')</button></div>'
    + (L.length ? '<div class="cards">' + L.map(promoCard).join('') + '</div>' : '<div class="empty">Tidak ada promo di daftar ini.</div>') + '</section>';
}
function vKalender() {
  var list = monthPromos(), cats = [];
  list.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
  var sel = App.day && App.day.slice(0, 7) === App.month ? App.day : '';
  var dayList = sel ? list.filter(function (p) { return (p.ranges || []).some(function (r) { return sel >= r[0] && sel <= r[1]; }); }) : [];
  return '<section class="sheet">' + head('Kalender promo', fmtMonth(App.month) + ' · ketuk tanggal untuk melihat promonya')
    + '<div class="sum" style="margin-bottom:12px">' + monthSelect() + '</div>'
    + calendar(list, sel)
    + '<div class="legend">' + cats.map(function (c) { return '<span><i style="--c:' + colorOf(c) + '"></i>' + esc(c) + '</span>'; }).join('') + '</div></section>'
    + (sel ? '<section class="panel"><div class="ph"><h2>' + DOW[dowOf(sel)] + ', ' + fmtDate(sel) + '</h2><span class="sub">' + dayList.length + ' promo</span></div>'
      + (dayList.length ? '<div class="cards">' + dayList.map(promoCard).join('') + '</div>' : '<div class="empty">Tidak ada promo di tanggal ini.</div>') + '</section>' : '')
    + (list.length ? '<section class="panel"><div class="ph"><h2>Timeline</h2><span class="sub">bar pudar = tanggal mengikuti ketentuan khusus</span></div>' + gantt(list) + '</section>' : '');
}
function vSemua() {
  var list = monthPromos(), cats = [];
  list.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
  var f = list.filter(function (p) {
    if (App.cat && p.cat !== App.cat) return false;
    if (!App.q) return true;
    return (p.title + ' ' + p.berlaku + ' ' + p.produk + ' ' + (p.ket || []).join(' ')).toLowerCase().indexOf(App.q.toLowerCase()) >= 0;
  });
  return '<section class="sheet">' + head('Semua promo', fmtMonth(App.month) + ' · ' + list.length + ' program')
    + '<div class="filters"><input class="inp" id="q" type="search" placeholder="Cari nama promo, produk, syarat…" value="' + esc(App.q) + '">'
    + '<div class="seg"><button data-cat="" class="' + (App.cat ? '' : 'on') + '">Semua</button>'
    + cats.map(function (c) { return '<button data-cat="' + esc(c) + '" class="' + (App.cat === c ? 'on' : '') + '">' + esc(c) + '</button>'; }).join('') + '</div></div>'
    + '<div id="semuaList">' + (f.length ? '<div class="cards">' + f.map(promoCard).join('') + '</div>' : '<div class="empty">Tidak ada promo yang cocok.</div>') + '</div></section>';
}
function vMemo() {
  var m = monthMemos(), B = App.data.bulan[App.month] || {};
  return '<section class="sheet">' + head('Memo & update', fmtMonth(App.month))
    + (B.fileMemo ? '<div class="xl" style="margin-bottom:12px"><a href="' + esc(B.fileMemo) + '" target="_blank" rel="noopener"><span class="x" style="background:var(--orange-tint);color:var(--orange-2)">' + svg('file') + '</span><span><b>File memo</b><small>buka dokumen asli</small></span><span class="go">' + svg('ext') + '</span></a></div>' : '')
    + (m.length ? m.slice().reverse().map(memoCard).join('') : '<div class="empty">Belum ada memo bulan ini.</div>') + '</section>';
}
function vArtikel() {
  var rows = [], B = App.data.bulan[App.month] || {};
  monthPromos().forEach(function (p) { (p.excel || []).forEach(function (x) { rows.push({ p: p, x: x }); }); });
  return '<section class="sheet">' + head('List artikel promo', fmtMonth(App.month) + ' · ' + rows.length + ' file')
    + '<div class="xl">'
    + (B.fileJuknis ? '<a href="' + esc(B.fileJuknis) + '" target="_blank" rel="noopener"><span class="x" style="background:var(--bad-bg);color:var(--bad)">' + svg('file') + '</span><span><b>Juknis lengkap</b><small>' + esc(B.title || 'File juknis') + '</small></span><span class="go">' + svg('ext') + '</span></a>' : '')
    + rows.map(function (r) {
        return '<a href="' + esc(r.x.u) + '" target="_blank" rel="noopener"><span class="x">' + svg('sheet') + '</span><span><b>' + esc(r.x.t || 'List artikel') + '</b><small>' + esc(r.p.title) + '</small></span><span class="go">' + svg('ext') + '</span></a>';
      }).join('') + '</div>'
    + (!rows.length && !B.fileJuknis ? '<div class="empty">Belum ada file list artikel untuk bulan ini.</div>' : '') + '</section>';
}
function vAkun() {
  var live = (App.online || []).filter(function (o) { return o.ago < 180 && o.kind === 'site'; });
  var recent = (App.online || []).filter(function (o) { return o.ago >= 180 && o.ago < 3600 && o.kind === 'site'; });
  var row = function (o) {
    return '<div class="r"><span class="av">' + esc(String(o.code).slice(0, 4)) + '</span><span><b>' + esc(o.name || o.code) + '</b><small>No Site ' + esc(o.code) + '</small></span>'
      + '<span class="t">' + (o.ago < 180 ? '<span class="chip live">online</span>' : Math.round(o.ago / 60) + ' mnt lalu') + '</span></div>';
  };
  return '<section class="sheet">' + head('Akun toko', '')
    + '<div class="sum"><span class="lbl">Masuk sebagai</span><div class="big"><b style="font-size:24px">' + esc(App.site.code) + '</b></div>'
    + '<div class="small muted">' + esc(App.site.name || '') + '</div>'
    + '<div class="row"><button class="btn sm" id="aRefresh">' + 'Muat ulang data' + '</button><button class="btn sm danger" id="aOut">Keluar</button></div></div></section>'
    + '<section class="panel"><div class="ph"><h2>Toko online sekarang</h2><span class="sub">' + live.length + ' toko</span></div>'
    + '<div class="olist">' + (live.map(row).join('') || '<div class="empty">Belum ada toko lain yang online.</div>') + '</div></section>'
    + (recent.length ? '<section class="panel"><div class="ph"><h2>Baru saja aktif</h2></div><div class="olist">' + recent.map(row).join('') + '</div></section>' : '');
}
function memoCard(m) {
  return '<div class="memo"><h4>' + esc(m.title || 'Update promo') + (m.date ? ' <span class="small muted">' + fmtDate(m.date) + '</span>' : '') + '</h4>'
    + (m.isi && m.isi.length ? '<ul>' + m.isi.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '')
    + (m.tabel && m.tabel.length ? '<div class="tab">' + m.tabel.map(esc).join('\n') + '</div>' : '')
    + (m.link ? '<p style="margin:10px 0 0"><a href="' + esc(m.link) + '" target="_blank" rel="noopener">Buka file memo</a></p>' : '') + '</div>';
}

/* ------------------------------------------------------- kalender --- */
function calendar(list, sel) {
  var m = App.month, n = dimOf(m), first = dowOf(m + '-01'), cells = [], i, d;
  for (i = 0; i < first; i++) cells.push('<td class="off"></td>');
  for (d = 1; d <= n; d++) {
    var iso = m + '-' + pad(d), w = dowOf(iso), seen = {}, dots = '';
    var ps = list.filter(function (p) { return (p.ranges || []).some(function (r) { return iso >= r[0] && iso <= r[1]; }); });
    ps.forEach(function (p) { if (seen[p.cat]) return; seen[p.cat] = 1; dots += '<span class="dot" style="--c:' + colorOf(p.cat) + '"></span>'; });
    cells.push('<td data-day="' + iso + '" class="' + (w === 0 || w === 6 ? 'we ' : '') + (ps.length ? 'has ' : '') + (iso === App.today ? 'today ' : '') + (iso === sel ? 'sel' : '')
      + '" title="' + esc(ps.map(function (p) { return p.title; }).join(' · ') || 'Tidak ada promo') + '"><span class="dn">' + d + '</span><div class="dots">' + dots + '</div></td>');
  }
  while (cells.length % 7) cells.push('<td class="off"></td>');
  var rows = ''; for (i = 0; i < cells.length; i += 7) rows += '<tr>' + cells.slice(i, i + 7).join('') + '</tr>';
  return '<table class="cg"><thead><tr>' + ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map(function (x) { return '<th>' + x + '</th>'; }).join('')
    + '</tr></thead><tbody>' + rows + '</tbody></table>';
}
function gantt(list) {
  var m = App.month, n = dimOf(m), hd = '', d;
  for (d = 1; d <= n; d++) { var iso0 = m + '-' + pad(d), w0 = dowOf(iso0); hd += '<th class="' + (w0 === 0 || w0 === 6 ? 'we' : '') + (iso0 === App.today ? ' td' : '') + '">' + d + '</th>'; }
  return '<div class="gantt"><table class="gt"><thead><tr><th class="nm">Promo</th>' + hd + '</tr></thead><tbody>' + list.map(function (p) {
    var tds = '';
    for (var k = 1; k <= n; k++) {
      var iso = m + '-' + pad(k), w = dowOf(iso), inR = (p.ranges || []).some(function (r) { return iso >= r[0] && iso <= r[1]; });
      tds += '<td class="' + (w === 0 || w === 6 ? 'we' : '') + (iso === App.today ? ' td' : '') + '">' + (inR ? '<i style="--c:' + colorOf(p.cat) + ';opacity:' + (p.exact ? 1 : .4) + '"></i>' : '') + '</td>';
    }
    return '<tr data-p="' + esc(p.id) + '"><td class="nm">' + esc(p.title) + '</td>' + tds + '</tr>';
  }).join('') + '</tbody></table></div>';
}

/* --------------------------------------------------------- detail --- */
function openPromo(id) {
  var p = (App.data.promos || []).filter(function (x) { return x.id === id; })[0]; if (!p) return;
  var c = colorOf(p.cat), row = function (k, v) { return v ? '<tr><th>' + k + '</th><td>' + esc(v) + '</td></tr>' : ''; };
  var html = '<div class="ov" id="ov"><div class="drawer" role="dialog" aria-modal="true" style="--c:' + c + '"><div class="grab"></div>'
    + '<button class="btn sm x" data-close>Tutup</button><span class="dcat">' + esc(p.cat) + '</span><h2>' + esc(p.title) + '</h2>' + badgeOf(state(p))
    + '<h3>Syarat &amp; ketentuan</h3><table class="sk"><tbody>' + row('Periode', p.periode || rangeTxt(p.ranges)) + row('Tanggal', rangeTxt(p.ranges))
      + row('Min. transaksi', p.minTrx) + row('Maks. transaksi', p.maxTrx) + row('Berlaku di', p.berlaku) + row('Produk', p.produk) + '</tbody></table>'
    + (p.ket && p.ket.length ? '<h3>Ketentuan</h3><ul class="lst">' + p.ket.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '')
    + (p.tips ? '<div class="tips"><b>Tips kasir:</b> ' + esc(p.tips) + '</div>' : '')
    + (p.contoh && p.contoh.length ? '<h3>Contoh penerapan</h3>' + p.contoh.map(function (e) {
        return '<div class="ex ' + (e.ok ? '' : 'no') + '"><div class="ex-h"><span class="n">' + (e.n || '') + '</span><b>' + esc(e.judul) + '</b><span>' + (e.ok ? '✅' : '❌') + '</span></div>'
          + (e.item ? '<p>' + esc(e.item) + '</p>' : '') + (e.hasil || e.bayar ? '<div class="ex-r"><span>' + esc(e.hasil) + '</span>' + (e.bayar ? '<b>' + esc(e.bayar) + '</b>' : '') + '</div>' : '')
          + (e.pesan ? '<p class="small muted" style="font-style:italic">' + esc(e.pesan) + '</p>' : '') + '</div>';
      }).join('') : '')
    + (p.excel && p.excel.length ? '<h3>List artikel promo</h3><div class="xl">' + p.excel.map(function (x) {
        return '<a href="' + esc(x.u) + '" target="_blank" rel="noopener"><span class="x">' + svg('sheet') + '</span><span><b>' + esc(x.t || 'List artikel') + '</b><small>buka file Excel</small></span><span class="go">' + svg('ext') + '</span></a>';
      }).join('') + '</div>' : '')
    + '<p class="small muted" style="margin-top:18px">Selalu cocokkan dengan juknis resmi bila ada perbedaan.</p></div></div>';
  var d = document.createElement('div'); d.innerHTML = html; document.body.appendChild(d.firstChild);
  document.body.style.overflow = 'hidden';
}
function closeDrawer() { var o = $('#ov'); if (o) { o.remove(); document.body.style.overflow = ''; } }

/* ------------------------------------------------------------ ping -- */
var pingT = null;
function startPing() { stopPing(); pingT = setInterval(ping, 60000); }
function stopPing() { if (pingT) clearInterval(pingT); pingT = null; }
function ping() {
  if (!App.token || document.visibilityState !== 'visible') return;
  api('ping', { page: App.view }).then(function (r) { App.online = r.online || []; renderChrome(); if (App.view === 'akun' && !$('#ov')) render(); }).catch(function () {});
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') ping(); });

/* ---------------------------------------------------------- event --- */
document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.closest('#gateGo')) { doLogin(); return; }
  if (t.closest('#tbOut') || t.closest('#sOut') || t.closest('#aOut')) { doLogout(); return; }
  if (t.closest('#tbOnline')) { go('akun'); return; }
  if (t.closest('#aRefresh')) { boot(); return; }
  if (t.closest('[data-close]') || t.id === 'ov') { closeDrawer(); return; }
  var tile = t.closest('[data-tile]');
  if (tile) {
    var T = App._tiles[+tile.dataset.tile], B = App.data.bulan[App.month] || {};
    if (T[0] === 'pdf') { window.open(B.fileJuknis, '_blank', 'noopener'); return; }
    if (T[0] === 'nopdf') { toast('File juknis bulan ini belum ditautkan admin.'); return; }
    go(T[0], T[6]); return;
  }
  var g = t.closest('[data-go]'); if (g) { go(g.dataset.go, g.dataset.tab ? { tab: g.dataset.tab } : null); return; }
  var tb = t.closest('[data-tab]'); if (tb) { App.tab = tb.dataset.tab; render(); return; }
  var c = t.closest('[data-cat]'); if (c) { App.cat = c.dataset.cat; render(); return; }
  var dy = t.closest('[data-day]'); if (dy) { App.day = App.day === dy.dataset.day ? '' : dy.dataset.day; render(); return; }
  var p = t.closest('[data-p]'); if (p) { openPromo(p.dataset.p); return; }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'mSel') { App.month = e.target.value; App.cat = ''; App.q = ''; App.day = ''; render(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeDrawer();
  if (e.key === 'Enter' && e.target && e.target.id === 'siteIn') { e.preventDefault(); doLogin(); }
});
var qT;
document.addEventListener('input', function (e) {
  if (e.target.id !== 'q') return;
  App.q = e.target.value; clearTimeout(qT);
  qT = setTimeout(function () { var pos = e.target.selectionStart; render(); var n = $('#q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } }, 280);
});

/* ---------------------------------------------------------- mulai --- */
(function init() {
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(CFG.API || '') || /GANTI_DENGAN/.test(CFG.API)) {
    hideGate(); $('#view').innerHTML = '<div class="sheet"><div class="empty">Belum tersambung ke database.<br>Isi <b>API</b> di <code>config.js</code> dengan URL Web App Apps Script.</div></div>';
    return;
  }
  App.token = LS.get('promo_tok');
  if (!App.token) { showGate(''); return; }
  hideGate(); boot();
})();
</script>
